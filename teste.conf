# "server" é o bloco principal — define um servidor virtual dentro do Nginx
# é aqui que todas as regras de roteamento do PostaAe vivem
server {

    # "listen 80" diz ao Nginx para escutar requisições na porta 80
    # porta 80 é a porta padrão do protocolo HTTP — o browser a usa automaticamente
    # por isso você acessa http://localhost sem digitar nenhuma porta
    listen 80;

    # "server_name" define qual domínio esse servidor virtual responde
    # localhost → ambiente de desenvolvimento local
    # _ → curinga que aceita qualquer domínio — funciona em produção sem alterar o arquivo
    server_name localhost _;

    # "location /" define as regras para qualquer requisição na raiz
    # quando o browser pede http://localhost/ — essa regra é acionada
    location / {

        # "root" aponta para a pasta onde os arquivos estáticos estão dentro do container
        # é exatamente o caminho que o volume monta: ./frontend → /usr/share/nginx/html
        root /usr/share/nginx/html;

        # "index" define qual arquivo entregar quando o browser pede só "/"
        # sem isso o Nginx não saberia qual arquivo abrir — retornaria erro 403
        index index.html;

        # "try_files" tenta entregar o arquivo requisitado
        # $uri → tenta o caminho exato da requisição
        # $uri/ → tenta como pasta
        # /index.html → fallback: sempre entrega o index.html se não achar nada
        # esse fallback é o que faz a SPA funcionar — qualquer rota desconhecida
        # retorna o index.html e o JavaScript assume o controle da navegação
        try_files $uri $uri/ /index.html;
    }

    # "location /api/" define as regras para requisições que começam com /api/
    # quando o app.js faz fetch("/api/postagens") — essa regra é acionada
    location /api/ {

        # "rewrite" reescreve a URL antes de repassar para o JSON Server
        # remove o prefixo /api/ da URL — o JSON Server não conhece esse prefixo
        # ex: /api/postagens → /postagens
        # ^ indica início da URL, () captura o restante, $1 insere o que foi capturado
        rewrite ^/api/(.*) /$1 break;

        # "proxy_pass" repassa a requisição para o JSON Server na rede interna
        # json-server é o nome do serviço no docker-compose.yml
        # o Docker resolve esse nome para o IP interno do container automaticamente
        proxy_pass http://json-server:3000;

        # "proxy_http_version" define a versão do HTTP usada na comunicação interna
        # HTTP/1.1 suporta conexões persistentes — mais eficiente que abrir e fechar
        # a cada requisição, exatamente o que o Instagram usa internamente
        proxy_http_version 1.1;

        # "proxy_set_header Host" repassa o cabeçalho Host original para o JSON Server
        # sem isso o JSON Server não sabe qual host originou a requisição
        proxy_set_header Host $host;

        # "proxy_set_header X-Real-IP" repassa o IP real do usuário para o JSON Server
        # sem isso o JSON Server enxergaria sempre o IP interno do Nginx como origem
        proxy_set_header X-Real-IP $remote_addr;
    }
}